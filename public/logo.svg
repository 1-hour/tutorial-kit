<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#F7931E"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#grad)"/>
  <!-- Clock circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="white" stroke-width="24" stroke-linecap="round"/>
  <!-- Minute hand (pointing to 12, long) -->
  <line x1="256" y1="256" x2="256" y2="130" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <!-- Hour hand (pointing to 1, showing 1 o'clock) -->
  <line x1="256" y1="256" x2="320" y2="180" stroke="white" stroke-width="24" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="14" fill="white"/>
</svg>
